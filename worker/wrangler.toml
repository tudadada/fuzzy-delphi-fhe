name = "private-delphi"
main = "src/index.js"
compatibility_date = "2025-10-01"

[assets]
directory = "../web"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "FILES"
id = "REPLACE_WITH_KV_ID"

[[d1_databases]]
binding = "DB"
database_name = "private-delphi"
database_id = "REPLACE_WITH_D1_ID"

[vars]
GH_REPO = "tudadada/fuzzy-delphi-fhe"
GH_REF = "app-layer"

# Secrets (set with `wrangler secret put NAME`, never committed):
#   ADMIN_KEY          creates surveys
#   ACTION_KEY         lets the GitHub round workflow write keys/ and server outputs
#   GH_DISPATCH_TOKEN  optional: fine-grained token with actions:write, starts the round workflow on close
