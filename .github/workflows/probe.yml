name: probe
on:
  workflow_dispatch:
  push:
    branches: [app-layer]
    paths: ["probe/**", "fdfhe/**", "tests/**", ".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openfhe numpy pytest
      - run: python probe/api_probe.py
