name: probe
on:
  workflow_dispatch:
  push:
    branches: [app-layer]
    paths: ["probe/**", "fdfhe/**", "tests/**", ".github/workflows/probe.yml", ".github/scripts/**", "web/i18n/**", "scripts/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openfhe numpy pytest
      - run: bash .github/scripts/notice.sh api-probe python probe/api_probe.py
      - run: bash .github/scripts/notice.sh pytest python -m pytest -q tests/
      - run: python scripts/check_i18n.py
