name: wasm
on:
  workflow_dispatch:
  push:
    branches: [app-layer]
    paths: ["spike/**", "fdfhe/**", "wasm/**", "server/**", "worker/**", "tests/e2e.js", "web/assets/**", ".github/workflows/wasm-spike.yml", ".github/scripts/**"]
permissions:
  contents: write
env:
  OPENFHE_TAG: v1.6.1
  EMSDK_VERSION: 4.0.8
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cache OpenFHE (wasm build)
        id: ofhe
        uses: actions/cache@v4
        with:
          path: ~/ofhe-wasm
          key: ofhe-wasm-${{ env.OPENFHE_TAG }}-${{ env.EMSDK_VERSION }}-v1
      - name: Cache bindings
        id: bind
        uses: actions/cache@v4
        with:
          path: ~/owasm-out
          key: owasm-fd-${{ env.OPENFHE_TAG }}-${{ env.EMSDK_VERSION }}-${{ hashFiles('wasm/**') }}
      - uses: mymindstorm/setup-emsdk@v14
        if: steps.ofhe.outputs.cache-hit != 'true' || steps.bind.outputs.cache-hit != 'true'
        with: { version: "${{ env.EMSDK_VERSION }}" }
      - name: Build OpenFHE for wasm
        if: steps.ofhe.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --branch $OPENFHE_TAG https://github.com/openfheorg/openfhe-development.git ofhe
          mkdir ofhe/embuild && cd ofhe/embuild
          emcmake cmake .. -DCMAKE_INSTALL_PREFIX=$HOME/ofhe-wasm -DBUILD_UNITTESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF -DWITH_OPENMP=OFF
          emmake make -j4
          emmake make install
      - name: Build openfhe-wasm with fdfhe bindings
        if: steps.bind.outputs.cache-hit != 'true'
        run: OFHE_PREFIX=$HOME/ofhe-wasm bash .github/scripts/notice.sh wasm-build bash wasm/build.sh
      - run: pip install openfhe numpy
      - name: Vendor wasm lib and crypto context into web/
        run: |
          mkdir -p web/vendor/openfhe web/fhe
          cp $HOME/owasm-out/lib/* web/vendor/openfhe/
          [ -f web/fhe/cc.bin ] || python server/make_cc.py
      - name: Ballot encrypted in wasm, checked in python
        run: OWASM=$HOME/owasm-out bash .github/scripts/notice.sh wasm-roundtrip python spike/wasm_roundtrip.py
      - name: Key ceremony in wasm, full round
        run: OWASM=$HOME/owasm-out bash .github/scripts/notice.sh wasm-ceremony python spike/ceremony_py.py
      - name: End to end with the Worker
        run: |
          cd worker && npm ci --no-audit --no-fund
          printf 'ADMIN_KEY=ci-admin\nACTION_KEY=ci-action\n' > .dev.vars
          npx wrangler d1 execute private-delphi --local --file=schema.sql > /dev/null
          (npx wrangler dev --local --port 8787 > /tmp/wrangler.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/index.html > /dev/null && break; sleep 1; done
          node --test test/api.test.js
          cd ..
          BASE=http://127.0.0.1:8787 ADMIN_KEY=ci-admin ACTION_KEY=ci-action bash .github/scripts/notice.sh e2e node tests/e2e.js
      - name: Commit vendored files if they changed
        if: github.ref == 'refs/heads/app-layer'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/vendor/openfhe web/fhe/cc.bin
          if ! git diff --cached --quiet; then
            git commit -m "Update vendored openfhe-wasm build and crypto context [skip ci]"
            git push
          fi
