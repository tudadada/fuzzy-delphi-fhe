<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Results · Private Delphi</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="results">
<main class="wrap">
  <p class="small muted" id="survey-title"></p>
  <h1 id="title"></h1>
  <p class="muted" id="opened" style="display:flex;gap:8px;align-items:center"></p>
  <div id="empty" class="note warn" hidden><span data-i18n="results.empty"></span></div>
  <section id="body" class="card" hidden>
    <div class="metrics">
      <div class="metric"><span class="small muted" data-i18n="results.voted"></span><b id="m-voted"></b></div>
      <div class="metric"><span class="small muted" data-i18n="results.invalid"></span><b id="m-invalid"></b></div>
      <div class="metric"><span class="small muted" data-i18n="results.kept"></span><b id="m-kept"></b></div>
    </div>
    <div id="rows"></div>
    <p class="small muted" data-i18n="results.legend" style="margin-top:12px"></p>
  </section>
  <section class="card" style="margin-top:16px">
    <h3 data-i18n="results.check"></h3>
    <p class="small muted" data-i18n="results.check.body"></p>
    <a class="btn" id="board" href="#" data-i18n="results.download"></a>
  </section>
</main>
<script src="assets/layout.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/api.js"></script>
<script src="assets/common.js"></script>
<script src="assets/results.js"></script>
</body>
</html>
