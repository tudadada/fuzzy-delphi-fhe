<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Private Delphi</title>
<meta name="description" content="Expert consensus surveys where every answer is encrypted on the expert's device.">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="home">
<main class="wrap">
  <h1 data-i18n="home.title"></h1>
  <p class="lead" data-i18n="home.lead"></p>
  <p style="display:flex;gap:10px;flex-wrap:wrap">
    <a class="btn primary" href="vote.html" data-i18n="home.cta.vote"></a>
    <a class="btn" href="results.html" data-i18n="home.cta.results"></a>
  </p>

  <h2 data-i18n="nav.how"></h2>
  <div class="grid">
    <div class="step-card"><div class="num">1</div><h3 data-i18n="home.step1.title"></h3><p class="small muted" data-i18n="home.step1.body"></p></div>
    <div class="step-card"><div class="num">2</div><h3 data-i18n="home.step2.title"></h3><p class="small muted" data-i18n="home.step2.body"></p></div>
    <div class="step-card"><div class="num">3</div><h3 data-i18n="home.step3.title"></h3><p class="small muted" data-i18n="home.step3.body"></p></div>
    <div class="step-card"><div class="num">4</div><h3 data-i18n="home.step4.title"></h3><p class="small muted" data-i18n="home.step4.body"></p></div>
  </div>

  <h2 data-i18n="home.roles.title"></h2>
  <div class="grid">
    <div class="card"><h3 data-i18n="home.role.expert"></h3><p class="small muted" data-i18n="home.role.expert.body"></p></div>
    <div class="card"><h3 data-i18n="home.role.organizer"></h3><p class="small muted" data-i18n="home.role.organizer.body"></p></div>
    <div class="card"><h3 data-i18n="home.role.keyholder"></h3><p class="small muted" data-i18n="home.role.keyholder.body"></p></div>
    <div class="card"><h3 data-i18n="home.role.auditor"></h3><p class="small muted" data-i18n="home.role.auditor.body"></p></div>
  </div>
</main>
<script src="assets/layout.js"></script>
<script src="assets/i18n.js"></script>
<script>I18N.init();</script>
</body>
</html>
